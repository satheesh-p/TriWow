<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | Kerala Car Rentals</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Kerala<span class="highlight">Drives</span></a>
            <button class="menu-toggle" aria-label="Toggle Menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="cars.html">Fleet</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="contact.html" class="btn-primary">Book Now</a></li>
            </ul>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1>Contact Us</h1>
            <p>Get in touch to book your ride or ask any questions.</p>
        </div>
    </header>

    <section class="contact-section section">
        <div class="container contact-container">
            <div class="contact-info">
                <h2>Get in Touch</h2>
                <div class="info-item">
                    <h4>Address</h4>
                    <p>123 Marina Drive, Kochi, Kerala, 682031</p>
                </div>
                <div class="info-item">
                    <h4>Phone</h4>
                    <p>+91 98765 43210</p>
                </div>
                <div class="info-item">
                    <h4>Email</h4>
                    <p>bookings@keraladrives.com</p>
                </div>
            </div>

            <div class="contact-form-wrapper">
                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                        <label for="car">Interested Car (Optional)</label>
                        <select id="car" name="car">
                            <option value="">Select a Car</option>
                            <option value="innova">Toyota Innova</option>
                            <option value="swift">Maruti Swift</option>
                            <option value="city">Honda City</option>
                            <option value="luxury">Luxury / Commercial</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Your Message" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <script src="./main.js"></script>
</body>

</html>
